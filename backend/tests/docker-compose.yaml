services:
  mongodb-testing:
    image: mongo:latest
    ports:
      - "27018:27017"
    container_name: mongodb-testing
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    networks:
      - kriti-iitg-web-network
networks:
  kriti-iitg-web-network:
    driver: bridge
